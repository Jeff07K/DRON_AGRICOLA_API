<script>
/* ==================== USUARIOS + GRÁFICAS - VERSIÓN COMPLETA ==================== */
let uStarsChart = null;
let uDeptChart = null;

async function loadUserSection() {
    try {
        const stats = await fetch('/api/usuarios/stats').then(r => r.json());
        document.getElementById('u-total').textContent = stats.total_descargas;
        document.getElementById('u-prom').textContent = stats.promedio_puntuacion.toFixed(1) + ' ★';
        document.getElementById('u-depto').textContent = stats.departamento_top;
        document.getElementById('u-edad').textContent = stats.edad_promedio;

        const users = await fetch('/api/usuarios').then(r => r.json());

        // Gráfica estrellas
        if (uStarsChart) uStarsChart.destroy();
        const ctx1 = document.getElementById('ch-u-stars');
        uStarsChart = new Chart(ctx1, {
            type: 'bar',
            data: {
                labels: ['1 ★','2 ★','3 ★','4 ★','5 ★'],
                datasets: [{
                    data: [1,2,3,4,5].map(s => users.filter(u => u.puntuacion === s).length),
                    backgroundColor: ['#e53935','#fb8c00','#fdd835','#7cb342','#2e7d32'],
                    borderRadius: 6
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        // Gráfica departamentos
        if (uDeptChart) uDeptChart.destroy();
        const counts = {};
        users.forEach(u => counts[u.departamento] = (counts[u.departamento] || 0) + 1);
        const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0,8);

        const ctx2 = document.getElementById('ch-u-deptos');
        uDeptChart = new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: sorted.map(e => e[0]),
                datasets: [{ data: sorted.map(e => e[1]), backgroundColor: '#4caf50', borderRadius: 6 }]
            },
            options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

    } catch (err) {
        console.error("Error cargando usuarios:", err);
    }
}

loadUserSection();
</script>
